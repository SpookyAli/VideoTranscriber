[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcriber"
version = "0.1.0"
description = "Local WEBM transcription with Faster-Whisper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["faster-whisper==1.2.1", "av>=11,<18"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
video-transcriber = "video_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
